<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SupportIQ — Sign In to Workspace</title>
    <meta name="description" content="Sign in to SupportIQ AI-Powered Customer Intelligence & Support System for Customer and Admin access.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"Space Grotesk"', 'monospace'],
                    },
                    colors: {
                        dark: {
                            bg: '#040612',
                            card: '#0A0F24',
                            surface: '#0F1635',
                            border: 'rgba(255, 255, 255, 0.08)',
                            borderGlow: 'rgba(139, 92, 246, 0.3)'
                        },
                        brand: {
                            blue: '#38BDF8',
                            violet: '#8B5CF6',
                            purple: '#A855F7',
                            cyan: '#06B6D4',
                            emerald: '#10B981',
                            rose: '#F43F5E',
                            amber: '#F59E0B'
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'float-delayed': 'float 6s ease-in-out 3s infinite',
                        'glow': 'glow 3s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        glow: {
                            '0%': { opacity: '0.4', filter: 'drop-shadow(0 0 15px rgba(56, 189, 248, 0.4))' },
                            '100%': { opacity: '0.8', filter: 'drop-shadow(0 0 25px rgba(139, 92, 246, 0.7))' }
                        }
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./styles.css">

    <!-- React 18 & Babel Standalone -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#040612] text-slate-100 font-sans antialiased overflow-x-hidden selection:bg-brand-violet selection:text-white min-h-screen flex flex-col justify-between">
    <!-- Grid pattern background overlay -->
    <div class="fixed inset-0 pointer-events-none bg-[linear-gradient(to_right,#1e293b12_1px,transparent_1px),linear-gradient(to_bottom,#1e293b12_1px,transparent_1px)] bg-[size:4rem_4rem] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_0%,#000_70%,transparent_100%)] z-0"></div>

    <!-- Glowing ambient background lights -->
    <div class="fixed top-0 left-1/4 w-[600px] h-[600px] bg-brand-violet/15 rounded-full blur-[140px] pointer-events-none z-0"></div>
    <div class="fixed top-1/3 right-10 w-[500px] h-[500px] bg-brand-blue/15 rounded-full blur-[140px] pointer-events-none z-0"></div>
    <div class="fixed bottom-10 left-1/3 w-[600px] h-[600px] bg-brand-cyan/10 rounded-full blur-[160px] pointer-events-none z-0"></div>

    <!-- App Root Container -->
    <div id="login-root" class="relative z-10 min-h-screen flex flex-col justify-between"></div>

    <!-- Login Application Script -->
    <script type="text/babel" src="./login.jsx"></script>
</body>
</html>
